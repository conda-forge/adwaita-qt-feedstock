# Build against several qt6-main versions so adwaita-qt6 is installable across
# the qt6-main minors/patches still in wide use.
#
# qt6-main's run-export pins consumers to the exact patch it was built against
# (`qt6-main >=<build version>,<next minor>`). A bare '6.9' therefore resolves
# to the newest 6.9.x available at build time (currently 6.9.3) and produces a
# package requiring `qt6-main >=6.9.3`. That excludes environments held at
# qt6-main 6.9.2 -- e.g. stacks built around pcl 1.15.0 / robostack, where the
# Qt6 rebuild to 6.9.3 (newer libfreetype/libglib/libvulkan-loader) is not
# co-installable, so qt6-main is capped at 6.9.2. Pin the exact patch 6.9.2 as
# well so we also ship a build with `qt6-main >=6.9.2,<6.10` for them.
qt6_main:
  - '6.9.2'
  - '6.9'
  - '6.10'
