# Build against the oldest qt6-main minor still in use, not the newest one the global pin ('6') would pick.
#
# qt6-main 6.11+ run-exports only the major version (`qt6-main >=<build version>,<7`), so a build against 6.11 also
# installs with 6.12, while a build against the newest Qt would exclude environments held at 6.11: vtk 9.6.2 needs
# qt6-main >=6.11.1 and pyside6 stops at 6.11.2 (e.g. the RoboStack kilted ros2-distro-mutex 0.17 environments).
# Raise this once 6.11 environments are gone.
qt6_main:
  - '6.11'
