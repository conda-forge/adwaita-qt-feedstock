# Build against the oldest qt6-main minor still in use, not the newest one the global pin ('6') would pick.
#
# qt6-main 6.11+ run-exports only the major version (`qt6-main >=<build version>,<7`), so a build against 6.11 also
# installs with 6.12, while a build against the newest Qt would exclude environments held at 6.11: 
# e.g. the RoboStack kilted ros2-distro-mutex 0.17 environments has qt6-main >=6.11.2, <6.12.0 
# and pyside6 is currently only at 6.11.2, which pins qt6-main = 6.11.2.*
#
# Remove this pin when the migration for qt-main 6.11 rolls through
# https://github.com/conda-forge/conda-forge-pinning-feedstock/pull/9042
qt6_main:
  - '6.11'
